<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Off-brand</title>
<style>
  body { margin: 0; font-family: Inter, Arial, sans-serif; background: #F9FAFB; color: #111827; }
  main { padding: 40px; }
  h1 { font-size: 36px; margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(4, 300px); gap: 20px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
  .label { color: #9CA3AF; font-size: 13px; }
  .value { font-size: 30px; font-weight: 600; }
  button { background: linear-gradient(90deg, #6366F1, #9333EA); color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; font-size: 15px; }
</style></head>
<body><main>
  <h1>Dashboard</h1>
  <div class="grid">
    <div class="card"><div class="label">Revenue</div><div class="value">$48,210</div></div>
    <div class="card"><div class="label">Outstanding</div><div class="value">$9,830</div></div>
    <div class="card"><div class="label">Paid on time</div><div class="value">87%</div></div>
    <div class="card"><div class="label">Customers</div><div class="value">42</div></div>
  </div>
  <p><button>New invoice</button></p>
</main></body></html>
