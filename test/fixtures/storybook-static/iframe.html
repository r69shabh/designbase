<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>storybook preview</title>
<!-- Stands in for a real `storybook build` of test/fixtures/repo-v3: same contract
     (iframe.html?id=…&viewMode=story renders into #storybook-root, errors toggle
     .sb-show-errordisplay), with the components' compiled Tailwind classes inlined. -->
<style>
  body { margin: 0; padding: 16px; font-family: Inter, system-ui, sans-serif; color: #020817; background: #FFFFFF; }
  .sb-show-errordisplay #storybook-root { display: none; }
  #error-message { display: none; } .sb-show-errordisplay #error-message { display: block; }
  .btn { display: inline-flex; border-radius: 6px; padding: 8px 16px; font-size: 14px; line-height: 20px; border: 1px solid transparent; }
  .btn-primary { background: #0F172A; color: #F8FAFC; }
  .btn-secondary { background: #FFFFFF; color: #020817; border-color: #E2E8F0; }
  .btn-danger { background: #DC2626; color: #FFFFFF; }
  .spinner { color: #64748B; font-size: 12px; margin-left: 8px; }
  .field { display: block; font-size: 14px; }
  .field input { display: block; width: 280px; margin-top: 4px; border: 1px solid #E2E8F0; border-radius: 6px; padding: 8px 12px; font-size: 14px; }
  .field .error { display: block; margin-top: 4px; color: #DC2626; }
  form > * + * { margin-top: 16px; }
</style>
</head>
<body>
<div id="storybook-root"></div>
<pre id="error-message"></pre>
<script>
  const id = new URLSearchParams(location.search).get("id");
  const button = (cls, label, extra = "") => `<button class="btn ${cls}">${label}${extra}</button>`;
  const field = (err) => `<label class="field"><span>Email</span><input placeholder="you@example.com">${err ? `<span class="error">${err}</span>` : ""}</label>`;
  const stories = {
    "forms-actions-button--primary": () => button("btn-primary", "Save changes"),
    "forms-actions-button--secondary": () => button("btn-secondary", "Save changes"),
    "forms-actions-button--destructive": () => button("btn-danger", "Delete project"),
    "forms-actions-button--loading": () => button("btn-primary", "Save changes", `<span class="spinner">Saving…</span>`),
    "forms-actions-button--in-a-form": () => `<form>${field()}${button("btn-primary", "Save changes")}</form>`,
    "forms-textfield--default": () => field(),
    "forms-textfield--with-error": () => field("That email is already taken"),
  };
  // Rendered asynchronously, like a real preview.
  setTimeout(() => {
    if (stories[id]) document.getElementById("storybook-root").innerHTML = stories[id]();
    else {
      document.getElementById("error-message").textContent = "ReferenceError: Banner is not defined";
      document.body.classList.add("sb-show-errordisplay");
    }
  }, 50);
</script>
</body>
</html>
